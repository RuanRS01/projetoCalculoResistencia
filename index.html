<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora lei de ohm</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>&#937 Calculadora Lei de Ohm &#937</h1>

<main>
    <section>
        <div>
            <label for="resistencia"></label>
            <input class="dados" id="resistencia" type="number" placeholder="Insira a resistencia">
        </div>
        <div>
            <label for="ddp"></label>
            <input class="dados" id="ddp" type="number" placeholder="Insira a tensao">
        </div>
        <div>
            <label for="potencia"></label>
            <input class="dados" id="potencia" type="number" placeholder="Insira a potencia">
        </div>
        <div>
            <label for="intensidade"></label>
            <input class="dados" id="intensidade" type="number" placeholder="Insira a intensidade">
        </div>
    </section>

     <section>
        <input id="calcular" type="button" value="Calcular">
    </section>

    <section id="resultado">
        
    </section>
</main>

<script src="script.js"></script>    
</body>
</html>
